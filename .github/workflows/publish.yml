name: Publish SDK to Maven Central

on:
  push:
    branches:
      - 'release/**'

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: DevtoolSDK
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Extract Version from Branch
        id: get_version
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/release/}
          echo "VERSION_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew :devtool:testDebugUnitTest

      - name: Verify Gradle properties
        run: |
          echo "Key length: ${#ORG_GRADLE_PROJECT_signingInMemoryKey}"
          echo "Password length: ${#ORG_GRADLE_PROJECT_signingInMemoryKeyPassword}"
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Publish to Maven Central
        run: ./gradlew :devtool:publishAllPublicationsToMavenCentralRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ env.VERSION_NAME }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Release v${{ env.VERSION_NAME }}
          body: |
            ## Release v${{ env.VERSION_NAME }}
            The SDK has been successfully published to Maven Central.
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
